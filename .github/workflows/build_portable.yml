name: Build portable executables

on:
  workflow_dispatch: {}
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install build deps
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: Build single-file executable
        run: |
          pyinstaller --onefile --name zxp2boriel zxp2boriel.py

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zxp2boriel-${{ matrix.os }}
          path: dist/**

  release:
    name: Create GitHub Release and attach artifacts
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: zxp2boriel-ubuntu-latest
          path: artifacts/ubuntu

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: zxp2boriel-windows-latest
          path: artifacts/windows

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: zxp2boriel-macos-latest
          path: artifacts/macos

      - name: List downloaded artifacts
        run: |
          ls -R artifacts || true

      - name: Create GitHub Release and upload assets
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: Automated release with portable executables
          files: artifacts/**
          token: ${{ secrets.GITHUB_TOKEN }}
